name: Dripcraft Play Image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dripcraft-play-image.yaml
  pull_request:
    paths:
      - .github/workflows/dripcraft-play-image.yaml
  workflow_dispatch:

# Upstream commit of zardoy/minecraft-web-client to build. Keep it in step with
# the image tag in manifests/dripcraft-play/client.yaml.
env:
  MWC_REF: f9ea1d105fb62d7353f7fd1bd50f68b17ef48964

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The build reads .git for its version label, so keep the token out of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: zardoy/minecraft-web-client
          ref: ${{ env.MWC_REF }}
          persist-credentials: false

      # Publish only from main; a dispatch on another branch just builds.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          build-args: |
            DOWNLOAD_SOUNDS=true
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/sbrerup/dripcraft-play:${{ env.MWC_REF }}
