name: Dripcraft Portal Image

on:
  push:
    branches:
      - main
    paths:
      - services/dripcraft-portal/**
      - .github/workflows/dripcraft-portal-image.yaml
  pull_request:
    paths:
      - services/dripcraft-portal/**
      - .github/workflows/dripcraft-portal-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Test
        working-directory: services/dripcraft-portal
        run: python -m unittest discover -s tests

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/dripcraft-portal
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/sbrerup/dripcraft-portal:latest
            ghcr.io/sbrerup/dripcraft-portal:${{ github.sha }}
