name: Dripcraft Portal Image

on:
  push:
    branches:
      - main
    paths:
      - services/dripcraft-portal/**
      - .github/workflows/dripcraft-portal-image.yaml
  pull_request:
    paths:
      - services/dripcraft-portal/**
      - .github/workflows/dripcraft-portal-image.yaml
  workflow_dispatch:

# Pull requests and branch dispatches run code that anyone with write access can
# change (the tests, the Dockerfile), so only the main-only publish job may write
# packages, and no job leaves its token in .git/config.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Test
        working-directory: services/dripcraft-portal
        run: python -m unittest discover -s tests

      # On main the publish job builds the image instead.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: github.ref != 'refs/heads/main'
        with:
          context: services/dripcraft-portal
          push: false

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: services/dripcraft-portal
          push: true
          tags: |
            ghcr.io/sbrerup/dripcraft-portal:latest
            ghcr.io/sbrerup/dripcraft-portal:${{ github.sha }}
