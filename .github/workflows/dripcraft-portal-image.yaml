name: Dripcraft Portal Image

on:
  push:
    branches:
      - main
    paths:
      - services/dripcraft-portal/**
      - .github/workflows/dripcraft-portal-image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test
        working-directory: services/dripcraft-portal
        run: python -m unittest discover -s tests

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/dripcraft-portal
          push: true
          tags: |
            ghcr.io/sbrerup/dripcraft-portal:latest
            ghcr.io/sbrerup/dripcraft-portal:${{ github.sha }}
