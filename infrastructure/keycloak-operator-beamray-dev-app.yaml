apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator-beamray-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/keycloak/keycloak-k8s-resources.git
    targetRevision: 26.7.3
    path: kubernetes
    kustomize:
      namespace: beamray-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: beamray-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - ServerSideApply=true
