apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  # No resources-finalizer: deleting this Application must not delete the CRD,
  # every SealedSecret, or the sealing key.
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets/
    targetRevision: 2.18.5
    chart: sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
