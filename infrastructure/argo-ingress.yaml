apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dripcd
  annotations:
    # Admin UI: only the owner may reach it (see the tailnet policy).
    tailscale.com/tags: tag:k8s-admin
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - dripcd
  rules:
    - host: dripcd
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
