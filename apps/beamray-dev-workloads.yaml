apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beamray-dev-workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Restricted project; see infrastructure/beamray-dev-guardrails.yaml.
  project: beamray-dev-parent
  source:
    repoURL: https://git.turtle-vector.ts.net/beamray/beamray-dev.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
