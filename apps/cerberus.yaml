apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cerberus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sbrerup/cerberus.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cerberus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
