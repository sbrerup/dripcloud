apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dripcraft
  namespace: argocd
  annotations:
    # Client-side diff flags the API server's volumeClaimTemplates defaults on
    # the crafty StatefulSet, leaving the app OutOfSync and self-heal looping.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: 'https://github.com/sbrerup/dripcloud.git'
    targetRevision: HEAD
    path: manifests/crafty
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dripcraft
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
