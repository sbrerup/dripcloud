apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dripcraft
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sbrerup/dripcloud.git'
    targetRevision: HEAD
    path: manifests/crafty
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dripcraft
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
