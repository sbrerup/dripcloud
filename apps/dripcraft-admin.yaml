apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dripcraft-admin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sbrerup/mc-server-ui.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dripcraft-admin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
