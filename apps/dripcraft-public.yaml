apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dripcraft-public
  namespace: argocd
  annotations:
    # Client-side diff flags the API server's volumeClaimTemplates defaults on
    # the StatefulSet, leaving the app OutOfSync.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/sbrerup/dripcraft.git
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dripcraft-public
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
