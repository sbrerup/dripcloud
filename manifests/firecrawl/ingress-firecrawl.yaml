apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: firecrawl
  name: firecrawl
  namespace: beamray-agent-services
spec:
  ingressClassName: tailscale
  rules:
  - host: firecrawl
    http:
      paths:
      - backend:
          service:
            name: firecrawl-api
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - firecrawl
