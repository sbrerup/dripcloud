apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: firecrawl-playwright
    app.kubernetes.io/part-of: firecrawl
  name: firecrawl-playwright
  namespace: beamray-agent-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-playwright
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-playwright
        app.kubernetes.io/part-of: firecrawl
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PORT
          value: '3000'
        - name: MAX_CONCURRENT_PAGES
          value: '2'
        - name: BLOCK_MEDIA
          value: 'true'
        - name: ALLOW_LOCAL_WEBHOOKS
          value: 'false'
        image: ghcr.io/firecrawl/playwright-service@sha256:468009bae00911d40d7120d58489a1d529362c22c45585cb9076094fe61b0025
        imagePullPolicy: IfNotPresent
        name: playwright
        ports:
        - containerPort: 3000
          name: http
        resources:
          limits:
            cpu: 1500m
            memory: 3Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /tmp/.cache
          name: tmp-cache
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 1Gi
        name: tmp-cache
