apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: firecrawl-rabbitmq
    app.kubernetes.io/part-of: firecrawl
  name: firecrawl-rabbitmq
  namespace: beamray-agent-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-rabbitmq
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firecrawl-rabbitmq
        app.kubernetes.io/part-of: firecrawl
    spec:
      automountServiceAccountToken: false
      containers:
      - image: rabbitmq@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 30
          tcpSocket:
            port: amqp
          timeoutSeconds: 2
        name: rabbitmq
        ports:
        - containerPort: 5672
          name: amqp
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 10
          tcpSocket:
            port: amqp
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 999
          runAsNonRoot: true
          runAsUser: 999
        startupProbe:
          failureThreshold: 30
          periodSeconds: 5
          tcpSocket:
            port: amqp
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /var/lib/rabbitmq
          name: data
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: firecrawl-rabbitmq-data
