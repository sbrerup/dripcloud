apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crafty-panel
  labels:
    app.kubernetes.io/name: crafty
    app.kubernetes.io/component: panel
  annotations:
    # Admin UI: only the owner may reach it (see the tailnet policy).
    tailscale.com/tags: tag:k8s-admin
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - crafty
  rules:
    - host: crafty
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crafty-panel
                port:
                  name: https
