apiVersion: v1
kind: Service
metadata:
  name: crafty-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: crafty
  ports:
    - name: panel
      port: 8443
      targetPort: panel
---
# Crafty panel (JAR uploads, server console) is reachable only through the
# Tailscale Ingress in panel-ingress.yaml, never on the LAN load balancer.
apiVersion: v1
kind: Service
metadata:
  name: crafty-panel
spec:
  selector:
    app.kubernetes.io/name: crafty
  ports:
    - name: https
      port: 443
      targetPort: panel
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: crafty-tcp
  annotations:
    io.cilium/lb-ipam-ips: 10.1.2.250
    io.cilium/lb-ipam-sharing-key: dripcraft-shared
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: crafty
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
    - name: bluemap
      port: 8100
      targetPort: bluemap
      protocol: TCP
    - name: dynmap
      port: 8123
      targetPort: dynmap
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: crafty-bedrock
  annotations:
    io.cilium/lb-ipam-ips: 10.1.2.250
    io.cilium/lb-ipam-sharing-key: dripcraft-shared
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: crafty
  ports:
    - name: bedrock
      port: 19132
      targetPort: bedrock
      protocol: UDP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crafty
  labels:
    app.kubernetes.io/name: crafty
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 1
  serviceName: crafty-headless
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: crafty
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crafty
    spec:
      terminationGracePeriodSeconds: 300
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-data
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command:
            - sh
            - -ec
            - mkdir -p /data/backups /data/logs /data/servers /data/config /data/import && chmod 0775 /data /data/backups /data/logs /data/servers /data/config /data/import
          volumeMounts:
            - name: crafty-data
              mountPath: /data
      containers:
        - name: crafty
          image: arcadiatechnology/crafty-4:4.11.0@sha256:7b6e87514259549647e15ceeaf73d238792e6d77e2c79fc744d5badc8d6e997c
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Copenhagen
          ports:
            - name: panel
              containerPort: 8443
              protocol: TCP
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: bluemap
              containerPort: 8100
              protocol: TCP
            - name: dynmap
              containerPort: 8123
              protocol: TCP
            - name: bedrock
              containerPort: 19132
              protocol: UDP
          resources:
            requests:
              cpu: "3"
              memory: 18Gi
            limits:
              memory: 18Gi
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: panel
            failureThreshold: 36
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: panel
            failureThreshold: 4
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: panel
            failureThreshold: 6
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: crafty-data
              mountPath: /crafty/backups
              subPath: backups
            - name: crafty-data
              mountPath: /crafty/logs
              subPath: logs
            - name: crafty-data
              mountPath: /crafty/servers
              subPath: servers
            - name: crafty-data
              mountPath: /crafty/app/config
              subPath: config
            - name: crafty-data
              mountPath: /crafty/import
              subPath: import
  volumeClaimTemplates:
    - metadata:
        name: crafty-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 100Gi
