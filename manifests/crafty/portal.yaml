apiVersion: v1
kind: ConfigMap
metadata:
  name: dripcraft-portal-config
  labels:
    app.kubernetes.io/name: dripcraft-portal
data:
  CRAFTY_BASE_URL: "https://crafty-headless:8443"
  CRAFTY_PANEL_URL: "https://10.1.2.250:8443"
  CRAFTY_TLS_VERIFY: "false"
  PORT_RANGE_START: "25565"
  PORT_RANGE_END: "25585"
  SERVICE_EXTERNAL_PORT: "25565"
  DEFAULT_JAR_CATEGORY: "Mc_java_servers"
  DEFAULT_JAR_TYPE: "Paper"
  DEFAULT_MC_VERSION: ""
  DEFAULT_MEM_MIN: "1"
  DEFAULT_MEM_MAX: "4"
  TAILSCALE_DOMAIN: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dripcraft-portal
  labels:
    app.kubernetes.io/name: dripcraft-portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dripcraft-portal
  labels:
    app.kubernetes.io/name: dripcraft-portal
rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dripcraft-portal
  labels:
    app.kubernetes.io/name: dripcraft-portal
subjects:
  - kind: ServiceAccount
    name: dripcraft-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dripcraft-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dripcraft-portal
  labels:
    app.kubernetes.io/name: dripcraft-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dripcraft-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dripcraft-portal
    spec:
      serviceAccountName: dripcraft-portal
      containers:
        - name: portal
          image: ghcr.io/sbrerup/dripcraft-portal:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: dripcraft-portal-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CRAFTY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dripcraft-portal-crafty
                  key: apiToken
                  optional: true
            - name: CRAFTY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dripcraft-portal-crafty
                  key: username
                  optional: true
            - name: CRAFTY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dripcraft-portal-crafty
                  key: password
                  optional: true
            - name: PORTAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dripcraft-portal-crafty
                  key: portalToken
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dripcraft-portal
  labels:
    app.kubernetes.io/name: dripcraft-portal
spec:
  selector:
    app.kubernetes.io/name: dripcraft-portal
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dripcraft-portal
  labels:
    app.kubernetes.io/name: dripcraft-portal
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - dripcraft
  rules:
    - host: dripcraft
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dripcraft-portal
                port:
                  number: 80
