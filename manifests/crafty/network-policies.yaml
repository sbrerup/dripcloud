# Crafty runs third-party server JARs and plugins. Keep it reachable only on
# its game/map ports, keep the panel to the portal and the Tailscale Ingress,
# and keep it away from the LAN (hypervisor, CI runner) and the rest of the
# cluster. IPv6 egress is denied entirely.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crafty-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: crafty
  policyTypes: [Ingress]
  ingress:
    # LAN load balancer and Tailscale proxies: primary server, Bedrock, maps.
    - ports:
        - {protocol: TCP, port: 25565}
        - {protocol: UDP, port: 19132}
        - {protocol: TCP, port: 8100}
        - {protocol: TCP, port: 8123}
    # Secondary servers are exposed only through portal-created Tailscale
    # LoadBalancers (EXPOSE_ALLOWED_PORTS in portal.yaml).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - {protocol: TCP, port: 25566, endPort: 25665}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dripcraft-portal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - {protocol: TCP, port: 8443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crafty-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: crafty
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Public internet on any port (plugin downloads, Mojang auth, webhooks).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
---
# Portal egress stays open: it needs the Kubernetes API, which Cilium does not
# match with plain ipBlock rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dripcraft-portal-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dripcraft-portal
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - {protocol: TCP, port: 8080}
