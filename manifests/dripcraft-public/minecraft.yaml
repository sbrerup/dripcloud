apiVersion: v1
kind: Service
metadata:
  name: minecraft
  labels:
    app.kubernetes.io/name: minecraft
spec:
  # The playit tunnel's origin is typed into the playit dashboard, so this
  # address must stay stable across Service re-creation.
  clusterIP: 10.96.25.65
  selector:
    app.kubernetes.io/name: minecraft
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minecraft
  labels:
    app.kubernetes.io/name: minecraft
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 1
  serviceName: minecraft
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: minecraft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minecraft
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java25@sha256:e2fabc536673f8c6b343055c93f7a73e10caa79cd3368f645987593c65adf1e0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            # Bump VERSION and PAPER_BUILD together, after a backup.
            - name: VERSION
              value: "26.3"
            - name: PAPER_BUILD
              value: "241"
            # 4-10 players. Keep the pod limit about 4Gi above the heap: Java
            # needs about 1Gi on top of it, and the rest is file cache, which
            # counts against the limit and speeds up chunk loading.
            - name: MEMORY
              value: 6G
            - name: USE_AIKAR_FLAGS
              value: "TRUE"
            # Added to Aikar's flags, not a replacement for them.
            - name: JVM_XX_OPTS
              value: -XX:+UseTransparentHugePages -XX:+UseCompactObjectHeaders
            # Settings with no environment variable, applied on every start.
            - name: PATCH_DEFINITIONS
              value: /patches/tuning-patches.json
            # Access: online accounts on the whitelist only. Names are managed
            # with rcon-cli (see README) because this repository is public.
            - name: ONLINE_MODE
              value: "TRUE"
            - name: ENABLE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_WHITELIST
              value: "TRUE"
            - name: ENFORCE_SECURE_PROFILE
              value: "TRUE"
            - name: HIDE_ONLINE_PLAYERS
              value: "TRUE"
            - name: ENABLE_QUERY
              value: "FALSE"
            - name: ENABLE_COMMAND_BLOCK
              value: "FALSE"
            # Reachable on loopback only: the NetworkPolicy admits 25565 alone.
            - name: ENABLE_RCON
              value: "TRUE"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-rcon
                  key: password
            # Game settings.
            - name: MOTD
              value: DripCraft
            - name: MAX_PLAYERS
              value: "10"
            - name: DIFFICULTY
              value: hard
            - name: SPAWN_PROTECTION
              value: "0"
            # The main thread is the bottleneck on this CPU: keep chunks
            # simulated close to players, and let ZFS handle write ordering.
            - name: VIEW_DISTANCE
              value: "10"
            # Keep mob-spawn-range in tuning-patches.json equal to this.
            - name: SIMULATION_DISTANCE
              value: "6"
            - name: SYNC_CHUNK_WRITES
              value: "FALSE"
            # World pre-generation (see README).
            - name: MODRINTH_PROJECTS
              value: chunky:RBuKjN4k
            # Every connection must carry a PROXY header from the playit agent,
            # which is how the server sees real player addresses. mc-health
            # uses this to send the header itself.
            - name: USES_PROXY_PROTOCOL
              value: "TRUE"
            - name: STOP_DURATION
              value: "120"
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          # First boot downloads Paper and generates the world.
          startupProbe:
            exec:
              command: [mc-health]
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [mc-health]
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [mc-health]
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            # No CPU limit: throttling the JVM causes tick stalls.
            requests:
              cpu: "2"
              memory: 10Gi
            limits:
              memory: 10Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: paper-config
              mountPath: /config/paper-global.yml
              subPath: paper-global.yml
              readOnly: true
            - name: paper-config
              mountPath: /patches/tuning-patches.json
              subPath: tuning-patches.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: backup
          image: itzg/mc-backup:latest@sha256:452e5c458e1eeb7ee47ae2d4afca0cec14ce878a12b4a8311ad2586b5e6cb118
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: Europe/Copenhagen
            - name: BACKUP_METHOD
              value: tar
            - name: BACKUP_INTERVAL
              value: 6h
            - name: INITIAL_DELAY
              value: 15m
            - name: PRUNE_BACKUPS_DAYS
              value: "7"
            - name: SRC_DIR
              value: /data
            - name: DEST_DIR
              value: /backups
            - name: EXCLUDES
              value: "*.jar,cache,logs,libraries,versions"
            - name: RCON_HOST
              value: localhost
            - name: RCON_PORT
              value: "25575"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-rcon
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: backups
              mountPath: /backups
            - name: backup-tmp
              mountPath: /tmp
      volumes:
        - name: paper-config
          configMap:
            name: paper-config
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: backup-tmp
          emptyDir:
            sizeLimit: 256Mi
  # Separate volumes rather than subPaths: local-path volumes ignore fsGroup,
  # and these restricted pods have no root init container to fix ownership.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: backups
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 50Gi
