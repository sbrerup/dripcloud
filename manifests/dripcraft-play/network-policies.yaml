# The relay opens TCP connections to whatever host the browser asks for. Keep
# it to the Crafty game ports and the public internet (Microsoft login, public
# servers), away from the LAN and the rest of the cluster. The client only
# serves static files and gets no egress at all, which also disables the
# relay built into its image.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tailscale-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [dripcraft-play, dripcraft-relay]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 2344}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dripcraft-relay-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dripcraft-relay
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Crafty game ports (primary server and portal-created secondary servers).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dripcraft
          podSelector:
            matchLabels:
              app.kubernetes.io/name: crafty
      ports:
        - {protocol: TCP, port: 25565, endPort: 25665}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
