apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dripcraft-play
resources:
- client.yaml
- network-policies.yaml
- relay.yaml
# The client reads config.json once at startup; the name hash rolls the pod.
configMapGenerator:
- name: dripcraft-play-config
  files:
  - config.json
