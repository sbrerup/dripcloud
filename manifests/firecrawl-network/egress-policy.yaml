# IPv6 egress is denied entirely. No ingress restrictions are added.
# These are egress-only policies; incoming API access is unchanged.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firecrawl-public-web-egress
  namespace: beamray-agent-services
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [firecrawl-api, firecrawl-playwright]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firecrawl-api-dependencies-egress
  namespace: beamray-agent-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: firecrawl-api
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: firecrawl-redis
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: firecrawl-nuq-postgres
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: firecrawl-rabbitmq
      ports: [{protocol: TCP, port: 5672}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: firecrawl-playwright
      ports: [{protocol: TCP, port: 3000}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: searxng
      ports: [{protocol: TCP, port: 8080}]
