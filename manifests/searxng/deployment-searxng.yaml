apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: searxng
  name: searxng
  namespace: beamray-agent-services
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: SEARXNG_BASE_URL
          value: https://searxng.turtle-vector.ts.net/
        - name: SEARXNG_PORT
          value: '8080'
        - name: SEARXNG_BIND_ADDRESS
          value: 0.0.0.0
        - name: SEARXNG_SECRET
          valueFrom:
            secretKeyRef:
              key: secret-key
              name: searxng-runtime
        image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        name: searxng
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/searxng/settings.yml
          name: settings
          readOnly: true
          subPath: settings.yml
        - mountPath: /var/cache/searxng
          name: cache
      securityContext:
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 977
        runAsNonRoot: true
        runAsUser: 977
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: searxng-settings
        name: settings
      - emptyDir: {}
        name: cache
